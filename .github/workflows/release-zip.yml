name: Attach skill ZIP to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build copywise.zip with the skill folder at the top level
        run: cd skills && zip -r ../copywise.zip copywise
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" copywise.zip --clobber
